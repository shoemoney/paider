name: tests

# Paider auto-updates to Packagist on every push to main, so anything that lands here
# is immediately installable by anyone on dev-main. This workflow is the only thing
# standing between a broken commit and those users.
on:
  push:
    branches: [main]
  pull_request:

# `pull_request` (NOT pull_request_target) runs fork PRs without repository secrets.
# That is deliberate: the live suite costs real money and holds provider credentials,
# so a fork must never be able to reach them. See the `live` job's absence below —
# there isn't one, on purpose.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pest · php ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json requires ^8.4. 8.4 is the floor we promise; 8.5 is what
        # development actually happens on. Both must stay green or the constraint is a lie.
        php: ['8.4', '8.5']
        deps: ['locked']
        include:
          # One job resolves the lowest versions every constraint allows. Without it,
          # composer.lock hides an over-permissive constraint until a consumer — who has
          # no lock file, because this ships as a library — resolves something older and breaks.
          - php: '8.4'
            deps: 'lowest'

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The twelve extensions Paider ships with (EXTENSIONS.md).
          #
          # HONEST LIMITATION: setup-php ADDS these to the runner's default PHP, it does not
          # RESTRICT to them. So this job does not prove Paider runs on only-these-twelve — a
          # thirteenth dependency would pass here and fail in the static binary. That is exactly
          # how ext-dom was missed: nothing declares it (Termwind instantiates DOMDocument and
          # its own composer.json omits ext-dom), CI has it by default, and only an actual
          # trimmed FrankenPHP build surfaced it. The build is the real check; this is a floor.
          extensions: mbstring, tokenizer, ctype, fileinfo, iconv, curl, openssl, zlib, pdo_sqlite, phar, filter, dom
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.deps }}-

      - name: Install dependencies (locked)
        if: matrix.deps == 'locked'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install dependencies (lowest)
        if: matrix.deps == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Check code style (pint)
        run: vendor/bin/pint --test

      # A pin is a STABILITY control, not a security control, and this repository learned that
      # the expensive way: mcp/sdk was pinned to an exact 0.7.0 in Aug, and when the HIGH advisory
      # PKSA-p9gd-j6gr-6f9t (CVE-2026-53965) landed, the exact pin held the vulnerable version
      # in place indefinitely. The advisory was found only because the lowest-deps job happened
      # to refuse the install — nothing was checking for it.
      #
      # Fail on high and critical, tolerate low: league/flysystem carries a low advisory that is
      # transitive and pre-existing, and gating on it would train people to reach for
      # audit.abandoned/ignore rather than fix the real one.
      - name: Security audit (fail on high or critical)
        run: |
          set -euo pipefail
          composer audit --format=plain --no-interaction || true
          echo "---"
          # exit 0 when a high/critical advisory EXISTS (so `if` takes the failure branch).
          # The earlier version was inverted — `exit((int) ! $found)` returned 1 when the list
          # was EMPTY, which would have failed CI on a clean tree and passed on a vulnerable
          # one. A gate that is backwards is worse than no gate, so this is asserted by
          # tests/Feature/CiGateLogicTest.php rather than trusted.
          if composer audit --format=json --no-interaction 2>/dev/null \
            | php -r '$a=json_decode(stream_get_contents(STDIN),true); $all=array_merge(...array_values($a["advisories"] ?? [])) ?: []; exit(array_filter($all, fn(array $v): bool => in_array($v["severity"] ?? "", ["high","critical"], true)) ? 0 : 1);'
          then
            echo "::error::high or critical dependency advisory — see the audit output above"
            exit 1
          else
            echo "no high or critical advisories"
          fi

      # The default suite excludes the `live` group (phpunit.xml.dist), so this is hermetic:
      # no network, no provider credentials, no spend. If this step ever needs a secret,
      # something has leaked out of tests/Live and that is the bug, not the missing secret.
      - name: Run the hermetic suite
        run: vendor/bin/pest

      # The README, ROADMAP and this file all quote a test count, and a hand-maintained number is
      # wrong within one commit of any change — it was wrong three times in one day (518, 527,
      # 575). bin/sync-test-counts.sh regenerates it from a real run, so CI asserts the docs match
      # the suite instead of trusting them.
      - name: Docs quote the measured test count
        run: |
          set -euo pipefail
          expected="$(vendor/bin/pest 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -E '^ *Tests:' | tail -1 | sed -n 's/[^0-9]*\([0-9]*\) passed.*/\1/p')"
          for doc in README.md ROADMAP.md; do
            if ! grep -qE "(tests-${expected}%20passing|\*\*${expected} passing\*\*)" "$doc"; then
              echo "::error::$doc does not quote the measured count (${expected} passing). Run bin/sync-test-counts.sh"
              exit 1
            fi
          done
          echo "docs agree with the suite: ${expected} passing"

      - name: Prove the live suite is genuinely opt-in
        # With no credentials present the live tests must SKIP, not fail — otherwise every
        # fork PR and every contributor without keys sees a red build for no reason.
        # This asserts the guard, and costs nothing because nothing is called.
        run: |
          set -euo pipefail
          vendor/bin/pest --group=live > /tmp/live-pest.txt 2>&1
          cat /tmp/live-pest.txt
          grep -qE '3 skipped' /tmp/live-pest.txt \
            || { echo "::error::live tests did not skip cleanly without credentials"; exit 1; }

  cli:
    name: the binary actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, tokenizer, ctype, fileinfo, iconv, curl, openssl, zlib, pdo_sqlite, phar, filter, dom
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      # A green unit suite does not prove the entry point boots. It boots through a different
      # path than the tests do, and Laravel Zero has already broken there once (Phar::running()
      # at bootstrap, which a trimmed build could not satisfy).
      - name: Smoke-test the CLI
        run: |
          set -euo pipefail
          ./paider --version
          ./paider list | tee /tmp/list.txt
          for c in chat commit cost config:provider config:show; do
            grep -qE "^[[:space:]]+$c( |$)" /tmp/list.txt \
              || { echo "::error::command '$c' is not registered"; exit 1; }
          done

      - name: Cost ledger reports real money, end to end
        # Seeds an event log, runs the real binary, and asserts a non-zero total. This is the
        # product's flagship claim; a regression that silently returns to $0.000 would otherwise
        # only be caught by someone reading the output.
        run: |
          set -euo pipefail
          export WORK="$(mktemp -d)"
          mkdir -p "$WORK/.paider"
          php -r '
            $d = new PDO("sqlite:" . getenv("WORK") . "/.paider/paider.db");
            $d->exec("CREATE TABLE IF NOT EXISTS events (id TEXT PRIMARY KEY, type TEXT NOT NULL, payload TEXT NOT NULL, created_at TEXT NOT NULL)");
            $d->prepare("INSERT INTO events VALUES (?,?,?,?)")->execute([
                "e1", "tier_call",
                json_encode(["tier" => "orchestrator", "model" => "anthropic/claude-opus-5", "tokens_in" => 61200, "tokens_out" => 19800, "cost_usd" => 0.801]),
                gmdate("c"),
            ]);
          '
          cd "$WORK" && "$GITHUB_WORKSPACE/paider" cost | tee /tmp/cost.txt
          grep -q '0\.801' /tmp/cost.txt \
            || { echo "::error::cost command did not report the seeded spend"; exit 1; }

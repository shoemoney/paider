name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phar:
    name: build paider.phar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, tokenizer, ctype, fileinfo, iconv, curl, openssl, zlib, pdo_sqlite, phar, filter, dom
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install box
        run: |
          curl -LS https://github.com/humbug/box/releases/latest/download/box.phar -o /tmp/box.phar
          chmod +x /tmp/box.phar
          /tmp/box.phar --version

      - name: Compile PHAR
        run: |
          mkdir -p build
          /tmp/box.phar compile
          ls -lh build/paider.phar
          php build/paider.phar --version
          php build/paider.phar list

      - name: Upload PHAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: paider.phar
          path: build/paider.phar

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/paider.phar

      # cosign PHAR signing deferred to v1.1 — requires OIDC + keyless setup and
      # key distribution docs. PHAR is fetched over HTTPS from github.com/shoemoney/paider
      # releases; signature verification will use `cosign verify-blob` once wired.
